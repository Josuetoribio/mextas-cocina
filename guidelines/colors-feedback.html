<!-- @dsCard group="Colors" viewport="700x150" name="Feedback" subtitle="Muted success / error / warning — never saturated" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#121210;font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}.c{height:64px;border:1px solid rgba(128,128,128,.25)}.s{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#EDE8E1}.s b{font-weight:500;font-size:12px;margin-top:6px}.s span{opacity:.7}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--mx-success)"></div><b>Success</b><span>--mx-success</span><span>#7E9A6C</span></div><div class="s"><div class="c" style="background:var(--mx-error)"></div><b>Error</b><span>--mx-error</span><span>#C0634B</span></div><div class="s"><div class="c" style="background:var(--mx-warning)"></div><b>Warning</b><span>--mx-warning</span><span>#C9A06A</span></div></div></body></html>
