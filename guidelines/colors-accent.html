<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#121210;font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:14px}.c{height:64px;border:1px solid rgba(128,128,128,.25)}.s{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#EDE8E1}.s b{font-weight:500;font-size:12px;margin-top:6px}.s span{opacity:.7}</style></head><body><div class="g"><div class="s"><div class="c" style="background:var(--mx-gold-soft)"></div><b>Gold soft</b><span>--mx-gold-soft</span><span>#DDBF93</span></div><div class="s"><div class="c" style="background:var(--mx-gold)"></div><b>Gold</b><span>--mx-gold</span><span>#C9A06A</span></div><div class="s"><div class="c" style="background:var(--mx-gold-deep)"></div><b>Gold deep</b><span>--mx-gold-deep</span><span>#A57D4C</span></div><div class="s"><div class="c" style="background:var(--mx-amber)"></div><b>Amber</b><span>--mx-amber</span><span>#B7792F</span></div><div class="s"><div class="c" style="background:var(--mx-brown)"></div><b>Brown</b><span>--mx-brown</span><span>#3B2A1D</span></div><div class="s"><div class="c" style="background:var(--mx-green)"></div><b>Deep green</b><span>--mx-green</span><span>#2C3A2E</span></div></div></body></html>
