<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Slow editorial ease-out; fades up 18px; hover zoom 1.05 over 1.2s" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css"><style>body{margin:0;padding:24px;background:#121210;font-family:var(--font-sans)}.r{display:flex;gap:18px}.x{flex:1;padding:14px;border:1px solid var(--line-dark);color:var(--text-on-dark);font-size:12px;display:flex;flex-direction:column;gap:6px}.x b{color:var(--mx-gold);font-weight:500;letter-spacing:.14em;font-size:10px;text-transform:uppercase}.d{width:10px;height:10px;background:var(--mx-gold);animation:mx-fade-up 1.6s var(--ease-editorial) infinite alternate}</style></head><body><div class="r"><div class="x"><b>--ease-editorial</b>cubic-bezier(.16,1,.3,1)<div class="d"></div></div><div class="x"><b>Durations</b>180 · 320 · 700 · 1000ms</div><div class="x"><b>Reveal</b>fade-up 18px, stagger 80ms</div></div></body></html>
